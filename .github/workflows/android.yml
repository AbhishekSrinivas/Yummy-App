name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build the web app
        env:
          BUILD_ID: ${{ github.run_number }}
        run: python3 src/build.py

      - name: Install Capacitor
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: App icon and launcher assets
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0F6E6E' --iconBackgroundColorDark '#1E5B3A'

      - name: Keep the screen on while cooking
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <application#' "$MANIFEST"

      - name: Stamp the build number into the APK
        run: |
          GRADLE=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" "$GRADLE"
          grep -n "versionCode\|versionName" "$GRADLE"

      - name: Sync web files into the app
        run: npx cap sync android

      - name: Restore the signing key saved by earlier builds
        id: keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: yummy-debug-keystore-v1

      - name: Create the signing key on the first build
        if: steps.keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 36500 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yummy-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish as the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Yummy.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Yummy.apk www/app.html www/version.json \
            --title "Yummy (latest build)" \
            --notes "Debug APK built from commit ${GITHUB_SHA::7}. Download Yummy.apk, open it on an Android device and allow installs from this source. app.html and version.json are what installed apps download when they check for updates."
